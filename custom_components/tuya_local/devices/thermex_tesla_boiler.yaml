name: Thermex Tesla Boiler
products:
  - id: g4x9mkw0hyjqcff4
    manufacturer: Thermex
    model: Tesla Series
entities:
  - entity: switch
    icon: "mdi:water-boiler"
    dps:
      - id: 1
        name: switch
        type: boolean

  - entity: climate
    name: Thermostat
    icon: "mdi:radiator"
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat
      - id: 118
        name: temperature
        type: base64
        mask: "ff"
        force: true
        range:
          min: 30
          max: 80
        unit: C
      - id: 119
        name: current_temperature
        type: base64
        mask: "ff"
        force: true
        unit: C
      - id: 101
        name: preset_mode
        type: string
        mapping:
          - dps_val: L1
            value: eco
          - dps_val: L2
            value: comfort
          - dps_val: L3
            value: boost

  - entity: select
    name: Power level
    icon: "mdi:lightning-bolt"
    category: config
    dps:
      - id: 101
        type: string
        name: option
        mapping:
          - dps_val: L1
            value: "L1 (6 кВт)"
          - dps_val: L2
            value: "L2 (9 кВт)"
          - dps_val: L3
            value: "L3 (12 кВт)"

  - entity: sensor
    name: Water temperature
    class: temperature
    state_class: measurement
    category: diagnostic
    dps:
      - id: 119
        type: base64
        name: sensor
        mask: "ff"
        force: true
        unit: C

  - entity: sensor
    name: Target temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 118
        type: base64
        name: sensor
        mask: "ff"
        force: true
        unit: C

  - entity: sensor
    name: Fault code
    icon: "mdi:alert-circle-outline"
    category: diagnostic
    dps:
      - id: 20
        type: integer
        name: sensor

  - entity: binary_sensor
    name: Fault
    class: problem
    category: diagnostic
    dps:
      - id: 20
        type: integer
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true

  - entity: switch
    name: Child lock
    icon: "mdi:account-lock"
    category: config
    dps:
      - id: 16
        name: switch
        type: boolean

